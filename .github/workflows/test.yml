name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only PRs cancel superseded runs; every push to main gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The jobs live in ci.yml so release.yml runs exactly the same gate.
  ci:
    uses: ./.github/workflows/ci.yml
