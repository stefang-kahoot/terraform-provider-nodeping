name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly published CVEs surface even without a commit.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Only PRs cancel superseded runs, so a push to main and the weekly schedule
# never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fork and Dependabot PRs get a read-only GITHUB_TOKEN that `permissions`
  # cannot raise, and upload-sarif fails the job on the resulting 403. Those
  # runs still scan and still gate; they just don't publish to the Security tab.
  CAN_UPLOAD_SARIF: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' }}
  GITLEAKS_VERSION: v8.30.1
  TRIVY_VERSION: 0.74.0

jobs:
  secret-scan:
    name: Secret detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the whole point is to catch secrets in *any* commit,
          # not just the tip.
          fetch-depth: 0

      # The official gitleaks-action requires a paid licence for organisation
      # accounts, so run the (MIT licensed) binary from its image instead.
      - name: Run gitleaks
        id: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            "zricethezav/gitleaks:${GITLEAKS_VERSION}" \
            detect \
              --source=/repo \
              --config=/repo/.gitleaks.toml \
              --report-format sarif \
              --report-path /repo/gitleaks.sarif \
              --redact \
              --no-banner \
              --exit-code 1
        # --redact is mandatory: without it a detected secret would be printed
        # into a public build log, i.e. leaked a second time.

      - name: Upload gitleaks SARIF
        if: >-
          always() && hashFiles('gitleaks.sarif') != '' &&
          env.CAN_UPLOAD_SARIF == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # Trivy flags a Go module as soon as any advisory mentions it, even when the
  # affected package is never imported. govulncheck resolves that at symbol
  # level, so it is the authoritative signal for Go dependencies here.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  trivy:
    name: Trivy (vulnerabilities, misconfig, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # First pass: never fails, produces the SARIF for the Security tab so
      # findings stay visible even while an exception is active.
      - name: Trivy scan (report)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            "aquasec/trivy:${TRIVY_VERSION}" fs \
              --scanners vuln,secret,misconfig \
              --format sarif \
              --output /repo/trivy.sarif \
              --no-progress \
              --exit-code 0 \
              /repo

      - name: Upload Trivy SARIF
        if: >-
          always() && hashFiles('trivy.sarif') != '' &&
          env.CAN_UPLOAD_SARIF == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy

      # Second pass: the actual gate. Exceptions live in .trivyignore.yaml and
      # every one of them carries an expiry date.
      - name: Trivy scan (gate)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            "aquasec/trivy:${TRIVY_VERSION}" fs \
              --scanners vuln,secret,misconfig \
              --severity HIGH,CRITICAL \
              --ignorefile /repo/.trivyignore.yaml \
              --no-progress \
              --exit-code 1 \
              /repo
