name: ci

# The real build and test jobs. Never triggered directly: test.yml calls this on
# push/PR, and release.yml calls it before goreleaser, so a tagged commit is
# tested as the tagged commit by the same definition that gates every PR.
on:
  workflow_call:

permissions:
  contents: read

env:
  GO_VERSION: '1.27'
  # Dependabot reads `uses:` only, so these three are invisible to it.
  # scripts/check-pins.sh flags them when upstream moves on, and fails if
  # GOLANGCI_LINT_VERSION drifts from the Makefile's.
  GOLANGCI_LINT_VERSION: v2.14.0
  ACTIONLINT_VERSION: 1.7.12
  ZIZMOR_VERSION: 1.30.1

jobs:
  build:
    # Vet now runs in the golangci-lint job, but the name stays: the `main`
    # ruleset requires `ci / Build & vet` by exact string.
    name: Build & vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go build
        run: go build -v ./...

      # A stale go.mod/go.sum breaks reproducible builds; catch it here rather
      # than during a release.
      - name: go mod tidy is a no-op
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # Dependabot can only edit manifests, never the README. This turns a
      # stale version table into a failing check instead of silent drift.
      - name: README version table is current
        run: ./scripts/sync-readme-versions.sh --check

  # Also covers gofmt and go vet, which used to be steps in the build job.
  # Configuration lives in .golangci.yml.
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  # zizmor audits the workflows for security problems (unpinned actions,
  # template injection, credential persistence); actionlint checks that they
  # are valid at all, including shellcheck on every `run:`. Both run offline
  # from pinned images, so a commit lints the same way on a PR and on its tag.
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            "rhysd/actionlint:${ACTIONLINT_VERSION}" -color

      # Online audits (impostor commits, known-vulnerable actions) need the
      # GitHub API and would make the result depend on the day it ran.
      - name: zizmor
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            "ghcr.io/zizmorcore/zizmor:${ZIZMOR_VERSION}" \
              --offline --format github .

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out -coverpkg=./... ./...

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -1
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  acceptance:
    name: Acceptance tests
    runs-on: ubuntu-latest
    # go test below has its own 20m limit; this only adds setup headroom.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The acceptance tests drive a real terraform binary against an
      # in-process mock of the NodePing API. No credentials and no network
      # calls to nodeping.com are involved, so this is safe to run on every PR.
      # The Dockerfile's terraform stage is the one pin Dependabot bumps, so
      # read it from there rather than keeping a second copy here.
      - name: Terraform version from Dockerfile
        id: terraform
        run: |
          version=$(sed -n 's|^FROM hashicorp/terraform:\([0-9][0-9.]*\) .*|\1|p' Dockerfile)
          [ -n "$version" ] || { echo "no hashicorp/terraform stage in Dockerfile" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform.outputs.version }}
          terraform_wrapper: false

      - name: go test -run TestAcc
        env:
          TF_ACC: '1'
        run: go test -v -timeout 20m -run 'TestAcc' ./...

  # Both release bugs this repo has shipped (manifest missing from SHA256SUMS,
  # protocol version undeclared) were valid goreleaser config producing the
  # wrong artifact set, so `goreleaser check` passes on them. Building a
  # snapshot and asserting the inventory is what catches that class.
  snapshot:
    name: Release snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser derives the snapshot version from the latest tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # This job also runs inside release.yml; a cache written by a PR run
          # must not be able to make the snapshot pass.
          cache: false

      # Keep `version` in step with release.yml: this job exists to prove the
      # exact goreleaser that will cut the release. scripts/check-pins.sh
      # enforces both.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --snapshot --clean --skip=publish,sign

      - name: Release artifact set is complete
        run: ./scripts/check-release-artifacts.sh dist
